{% extends "phone_base.html" %}
{% block title %}Join Pod 12{% endblock %}
{% block body %}
<section class="card hero-phone">
  <h1>Join the demo</h1>
  <p class="muted">Type the 6-digit code shown on the laptop screen.</p>
  {% if locked %}<p class="flash bad">Too many wrong codes from this phone. Ask the presenter to restart the server.</p>{% else %}
  <form method="post" action="/join" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <input class="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" required autofocus placeholder="••••••">
    <button class="btn big" type="submit">Join</button>
  </form>{% endif %}
</section>
{% endblock %}
