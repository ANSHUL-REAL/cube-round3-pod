grades:
- code: new
  label: New
  text: A brand-new, unused and unopened item in the original packaging with all of
    the original packaging materials included. The original manufacturer's warranty,
    if any, should still apply, with details of any such warranty included when you
    complete the Add your comments section of the product listing.
- code: used_like_new
  label: Used - Like New
  text: an apparently untouched item in perfect condition. The original plastic wrap
    may be missing, but the original packaging is intact. There are absolutely no
    signs of wear. Suitable for presenting as a gift.
- code: used_very_good
  label: Used - Very Good
  text: a well-cared-for item that has seen limited use but remains in great condition.
    The item and its instructions are complete and undamaged, but may show some signs
    of wear. The item works perfectly.
- code: used_good
  label: Used - Good
  text: the item shows wear from consistent use, but remains in good condition. The
    original instructions are included, and are in acceptable condition. The item
    may be marked or identified, and show other signs of previous use. The item works
    perfectly and is in good overall shape.
- code: used_acceptable
  label: Used - Acceptable
  text: the item is fairly worn, but it continues to work perfectly. The signs of
    wear can include scratches, dents and other aesthetic problems. The box and non-essential
    instructions may be missing or damaged. The item may be marked or identified,
    and show other signs of previous use.
unacceptable_conditions:
- code: not_working
  text: Item does not work perfectly in every regard.
- code: not_clean
  text: Item is not clean, having signs of mould, heavy staining, or corrosion.
- code: damaged_hard_to_use
  text: Item is damaged in a way that renders it difficult to use.
- code: missing_essential
  text: Item is missing essential accompanying material or parts. (This does not necessarily
    include instructions.)
- code: needs_repair
  text: Item requires repair or service.
- code: counterfeit_or_copy
  text: Item was not created by the original manufacturer or copyright holder. This
    includes copies, counterfeits, replicas and imitations.
- code: promotional_copy
  text: Item was originally distributed as a promotional copy, promotional bundle,
    product sample or advance reading copy.
- code: obscured_details
  text: Any aspect of the item is obscured and not able to be read or viewed because
    of markings, stickers or other damage.
- code: expired
  text: Item has passed the expiration date (includes “best by” and “sell by” dates),
    has an unacceptable portion of its shelf life remaining, or has had the expiration
    date removed or tampered with.
- code: prohibited
  text: Item is prohibited for sale on Amazon.co.uk.
- code: designated_unsellable
  text: Item was intended for destruction or disposal or otherwise designated as unsellable
    by the manufacturer or a supplier, vendor, or retailer.
- code: home_damaged_or_defective
  text: Home & Garden items that do not work perfectly in every regard or are damaged
    in ways that render them difficult to use.
- code: home_missing_essential
  text: Items not manufactured or printed by the original manufacturer and for which
    essential accompanying material is missing (this does not necessarily include
    instructions).
- code: home_consumable_part_used
  text: Consumable items where any part has been used.
- code: home_requires_repair
  text: Products that require repair or service.
