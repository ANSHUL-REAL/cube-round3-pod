# Render Blueprint: Dashboard > New > Blueprint > pick this repo. Render builds the Dockerfile and asks for the two
# secrets marked `sync: false`. The database is Supabase (Postgres): paste its Session pooler connection string.
services:
  - type: web
    name: pod12-console
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore          # nearest Render region to Hyderabad
    plan: free                 # free sleeps after 15 min without visitors; Starter stays awake (Settings > Instance type)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL      # Supabase > Connect > Session pooler (not "Direct": Render cannot reach IPv6-only hosts)
        sync: false
      - key: GEMINI_API_KEY    # the four photo agents' model key; without it they answer "pending" and say why
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ADMIN_PASSWORD    # generated by Render: read it under Environment, sign in at /login
        generateValue: true
      - key: SESSION_SECRET    # signs the sign-in cookies
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
